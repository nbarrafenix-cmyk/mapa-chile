<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Direcciones - Chile</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #e74c3c;
        }
        h2 { color: #333; margin: 0; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e1e1e1;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #c0392b;
        }
        .btn-admin {
            background-color: #2c3e50;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 10px 15px;
        }
        .btn-admin:hover {
            background-color: #1a252f;
        }
        .btn-delete {
            background-color: #c0392b;
            padding: 5px 10px;
            font-size: 12px;
        }
        .btn-excel {
            background-color: #27ae60;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 10px 15px;
        }
        .btn-excel:hover {
            background-color: #219653;
        }
        #map {
            width: 100%;
            height: 450px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .info-panel {
            background: #e8f4f8;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #2c3e50;
        }
        #adminSection {
            display: none;
            border-top: 2px solid #eee;
            margin-top: 20px;
            padding-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
        }
        .login-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h2>Ingreso de Direcciones (Chile)</h2>
                <p style="color: #666; margin: 5px 0 0 0;">Sistema de registro en tiempo real con datos de contacto.</p>
            </div>
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Logo">
        </div>

        <div class="info-panel" id="estadoConexion">
            🔄 Conectando con la base de datos...
        </div>

        <!-- Formulario completo de ingreso -->
        <div class="form-group" id="formIngreso">
            <div class="form-row">
                <input type="text" id="nombreInput" placeholder="Nombre completo de la persona">
                <input type="text" id="rutInput" placeholder="RUT (ej: 12.345.678-9)">
            </div>
            <div class="form-row">
                <input type="text" id="telefonoInput" placeholder="Número de teléfono (ej: +56912345678)">
                <input type="text" id="addressInput" placeholder="Dirección en Chile (ej: Ahumada 120, Santiago)">
            </div>
            <button onclick="buscarYGuardarDireccion()">Guardar Registro en el Mapa</button>
        </div>

        <div id="map"></div>

        <button class="btn-admin" onclick="toggleAdminPanel()">🔒 Modo Administrador</button>

        <div id="adminSection">
            <h3>Panel de Control - Administrador</h3>
            <div class="login-box" id="loginBox">
                <input type="password" id="adminPassword" placeholder="Contraseña (admin123)">
                <button onclick="verificarAdmin()">Entrar</button>
            </div>

            <div id="adminContent" style="display:none;">
                <p style="color: green; font-weight: bold;">✔ Sesión de administrador activa</p>
                
                <!-- Botón para descargar Excel -->
                <button class="btn-excel" onclick="descargarExcel()">📥 Descargar Registros en Excel</button>

                <h4>Listado completo de registros:</h4>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>RUT</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Fecha</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDirecciones">
                        <tr><td colspan="6">Cargando registros...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        // Configuración oficial de Firebase
        const firebaseConfig = {
            databaseURL: "https://mapa-chile-c2b86-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Variable global para almacenar los datos actuales para el Excel
        let registrosGlobales = {};

        // Control de estado de conexión
        const panelConexion = document.getElementById('estadoConexion');
        db.ref('.info/connected').on('value', function(snap) {
            if (snap.val() === true) {
                panelConexion.innerHTML = "🟢 Conectado correctamente a la nube. Listo para registrar datos.";
                panelConexion.style.background = "#e1f5fe";
            } else {
                panelConexion.innerHTML = "🔴 Estableciendo conexión con Firebase...";
                panelConexion.style.background = "#ffebee";
            }
        });

        // Inicializar el mapa centrado en Chile
        var map = L.map('map').setView([-33.4489, -70.6693], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '© OpenStreetMap contributors | Chile'
        }).addTo(map);

        var markersGroup = L.layerGroup().addTo(map);

        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Escuchar datos en tiempo real de la base de datos
        db.ref('direcciones').on('value', (snapshot) => {
            markersGroup.clearLayers();
            const tabla = document.getElementById('tablaDirecciones');
            tabla.innerHTML = '';
            
            registrosGlobales = snapshot.val() || {};
            const data = registrosGlobales;

            if (Object.keys(data).length > 0) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    
                    if (item.lat && item.lon) {
                        var popupContent = `
                            <b>👤 Nombre:</b> ${item.nombre || 'No especificado'}<br>
                            <b>🆔 RUT:</b> ${item.rut || 'No especificado'}<br>
                            <b>📞 Teléfono:</b> ${item.telefono || 'No especificado'}<br>
                            <b>📍 Dirección:</b> ${item.direccion}
                        `;

                        var nuevoMarcador = L.marker([item.lat, item.lon], {icon: redIcon})
                            .bindPopup(popupContent);
                        markersGroup.addLayer(nuevoMarcador);
                    }

                    let fechaFormateada = item.fecha ? new Date(item.fecha).toLocaleString() : 'Sin fecha';
                    tabla.innerHTML += `
                        <tr>
                            <td>${item.nombre || '-'}</td>
                            <td>${item.rut || '-'}</td>
                            <td>${item.telefono || '-'}</td>
                            <td>${item.direccion}</td>
                            <td>${fechaFormateada}</td>
                            <td><button class="btn-delete" onclick="eliminarDireccion('${key}')">Eliminar</button></td>
                        </tr>
                    `;
                });
            } else {
                tabla.innerHTML = '<tr><td colspan="6">No hay registros todavía.</td></tr>';
            }
        });

        // Función para descargar los datos en formato Excel (CSV compatible)
        function descargarExcel() {
            if (!registrosGlobales || Object.keys(registrosGlobales).length === 0) {
                alert("No hay registros para descargar.");
                return;
            }

            // Cabeceras del archivo CSV
            let csvContent = "\uFEFFNombre,RUT,Teléfono,Dirección,Fecha,Latitud,Longitud\n";

            Object.keys(registrosGlobales).forEach(key => {
                let item = registrosGlobales[key];
                let nombre = `"${(item.nombre || '').replace(/"/g, '""')}"`;
                let rut = `"${(item.rut || '').replace(/"/g, '""')}"`;
                let telefono = `"${(item.telefono || '').replace(/"/g, '""')}"`;
                let direccion = `"${(item.direccion || '').replace(/"/g, '""')}"`;
                let fecha = item.fecha ? `"${new Date(item.fecha).toLocaleString()}"` : '""';
                let lat = item.lat || '';
                let lon = item.lon || '';

                csvContent += `${nombre},${rut},${telefono},${direccion},${fecha},${lat},${lon}\n`;
            });

            // Crear archivo descargable
            var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "registros_direcciones_chile.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Función para buscar y guardar todos los datos en Chile
        function buscarYGuardarDireccion() {
            var nombre = document.getElementById('nombreInput').value.trim();
            var rut = document.getElementById('rutInput').value.trim();
            var telefono = document.getElementById('telefonoInput').value.trim();
            var direccionInput = document.getElementById('addressInput').value.trim();

            if (!nombre || !rut || !telefono || !direccionInput) {
                alert('Por favor completa todos los campos (Nombre, RUT, Teléfono y Dirección)');
                return;
