<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Direcciones - Chile</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #e74c3c;
        }
        h2 { color: #333; margin: 0; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c0392b;
        }
        .btn-admin {
            background-color: #2c3e50;
            margin-bottom: 15px;
        }
        .btn-admin:hover {
            background-color: #1a252f;
        }
        .btn-delete {
            background-color: #c0392b;
            padding: 5px 10px;
            font-size: 12px;
        }
        #map {
            width: 100%;
            height: 450px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .info-panel {
            background: #e8f4f8;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #2c3e50;
        }
        /* Panel de Administrador Oculto por defecto */
        #adminSection {
            display: none;
            border-top: 2px solid #eee;
            margin-top: 20px;
            padding-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
        }
        .login-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h2>Ingreso de Direcciones (Chile)</h2>
                <p style="color: #666; margin: 5px 0 0 0;">Sistema de registro en tiempo real.</p>
            </div>
            <!-- CAMBIA AQUÍ LA URL DE TU IMAGEN -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Logo">
        </div>

        <div class="info-panel" id="userMessage">
            📍 Ingresa tu dirección en Chile para registrarla en el sistema.
        </div>

        <!-- Sección de Ingreso de Direcciones -->
        <div class="input-group" id="formIngreso">
            <input type="text" id="addressInput" placeholder="Ej: Ahumada 120, Santiago, Chile">
            <button onclick="buscarYGuardarDireccion()">Enviar Dirección</button>
        </div>

        <div id="map"></div>

        <!-- Botón para Acceso de Administrador -->
        <button class="btn-admin" onclick="toggleAdminPanel()">🔒 Modo Administrador</button>

        <!-- Panel de Administrador -->
        <div id="adminSection">
            <h3>Panel de Control - Administrador</h3>
            <div class="login-box" id="loginBox">
                <input type="password" id="adminPassword" placeholder="Ingresa la contraseña (ej: admin123)">
                <button onclick="verificarAdmin()">Entrar</button>
            </div>

            <div id="adminContent" style="display:none;">
                <p style="color: green; font-weight: bold;">✔ Sesión de administrador activa</p>
                <h4>Listado completo de direcciones registradas:</h4>
                <table>
                    <thead>
                        <tr>
                            <th>Dirección</th>
                            <th>Fecha</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDirecciones">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        // Configuración de la base de datos en la nube
        const firebaseConfig = {
            databaseURL: "https://mapa-direcciones-chile-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Inicializar el mapa centrado en Chile
        var map = L.map('map').setView([-33.4489, -70.6693], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '© OpenStreetMap contributors | Chile'
        }).addTo(map);

        var markersGroup = L.layerGroup().addTo(map);

        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Escuchar datos en tiempo real de la base de datos
        db.ref('direcciones').on('value', (snapshot) => {
            markersGroup.clearLayers();
            const tabla = document.getElementById('tablaDirecciones');
            tabla.innerHTML = '';
            
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    
                    // 1. Dibujar marcador en el mapa para todos
                    var nuevoMarcador = L.marker([item.lat, item.lon], {icon: redIcon})
                        .bindPopup(`<b>${item.direccion}</b>`);
                    markersGroup.addLayer(nuevoMarcador);

                    // 2. Agregar a la tabla del administrador
                    let fechaFormateada = item.fecha ? new Date(item.fecha).toLocaleString() : 'Sin fecha';
                    tabla.innerHTML += `
                        <tr>
                            <td>${item.direccion}</td>
                            <td>${fechaFormateada}</td>
                            <td><button class="btn-delete" onclick="eliminarDireccion('${key}')">Eliminar</button></td>
                        </tr>
                    `;
                });
            }
        });

        // Función para que los usuarios busquen y guarden estrictamente en Chile
        function buscarYGuardarDireccion() {
            var direccionInput = document.getElementById('addressInput').value.trim();
            if (!direccionInput) {
                alert('Por favor ingresa una dirección');
                return;
            }

            var queryBusqueda = direccionInput.toLowerCase().includes('chile') ? direccionInput : direccionInput + ", Chile";
            var url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=cl&q=${encodeURIComponent(queryBusqueda)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        var lat = parseFloat(data[0].lat);
                        var lon = parseFloat(data[0].lon);
                        var nombreReal = data[0].display_name;

                        // Guardar en Firebase
                        db.ref('direcciones').push({
                            direccion: nombreReal,
                            lat: lat,
                            lon: lon,
                            fecha: new Date().toISOString()
                        });

                        map.setView([lat, lon], 15);
                        document.getElementById('addressInput').value = '';
                        alert('¡Dirección guardada exitosamente!');
                    } else {
                        alert('No se encontró la dirección dentro de Chile. Intenta ser más específico.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Ocurrió un error al procesar la dirección.');
                });
        }

        // Mostrar u ocultar el panel de administrador
        function toggleAdminPanel() {
            var section = document.getElementById('adminSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        // Verificar contraseña de Administrador (Contraseña por defecto: admin123)
        function verificarAdmin() {
            var pass = document.getElementById('adminPassword').value;
            if (pass === 'admin123') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
            } else {
                alert('Contraseña incorrecta');
            }
        }

        // Función de administrador para eliminar un registro
        function eliminarDireccion(id) {
            if (confirm("¿Estás seguro de eliminar esta dirección del registro?")) {
                db.ref('direcciones/' + id).remove()
                    .then(() => alert('Dirección eliminada correctamente'))
                    .catch(error => alert('Error al eliminar'));
            }
        }
    </script>
</body>
</html>
