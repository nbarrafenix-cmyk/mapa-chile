<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Direcciones - Chile</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #e74c3c;
        }
        h2 { color: #333; margin: 0; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e1e1e1;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #c0392b;
        }
        .btn-admin {
            background-color: #2c3e50;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 10px 15px;
        }
        .btn-admin:hover {
            background-color: #1a252f;
        }
        .btn-delete {
            background-color: #c0392b;
            padding: 5px 10px;
            font-size: 12px;
        }
        #map {
            width: 100%;
            height: 450px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .info-panel {
            background: #e8f4f8;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #2c3e50;
        }
        #adminSection {
            display: none;
            border-top: 2px solid #eee;
            margin-top: 20px;
            padding-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
        }
        .login-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h2>Ingreso de Direcciones (Chile)</h2>
                <p style="color: #666; margin: 5px 0 0 0;">Sistema de registro en tiempo real con datos de contacto.</p>
            </div>
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Logo">
        </div>

        <div class="info-panel" id="estadoConexion">
            🔄 Conectando con la base de datos...
        </div>

        <!-- Formulario completo de ingreso -->
        <div class="form-group" id="formIngreso">
            <div class="form-row">
                <input type="text" id="nombreInput" placeholder="Nombre completo de la persona">
                <input type="text" id="rutInput" placeholder="RUT (ej: 12.345.678-9)">
            </div>
            <div class="form-row">
                <input type="text" id="telefonoInput" placeholder="Número de teléfono (ej: +56912345678)">
                <input type="text" id="addressInput" placeholder="Dirección en Chile (ej: Ahumada 120, Santiago)">
            </div>
            <button onclick="buscarYGuardarDireccion()">Guardar Registro en el Mapa</button>
        </div>

        <div id="map"></div>

        <button class="btn-admin" onclick="toggleAdminPanel()">🔒 Modo Administrador</button>

        <div id="adminSection">
            <h3>Panel de Control - Administrador</h3>
            <div class="login-box" id="loginBox">
                <input type="password" id="adminPassword" placeholder="Contraseña (admin123)">
                <button onclick="verificarAdmin()">Entrar</button>
            </div>

            <div id="adminContent" style="display:none;">
                <p style="color: green; font-weight: bold;">✔ Sesión de administrador activa</p>
                <h4>Listado completo de registros:</h4>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>RUT</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Fecha</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDirecciones">
                        <tr><td colspan="6">Cargando registros...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
